<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="index.css">
    <title>Регистрация | Кит Харинг</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="container">
        <header class="site-header">
            <div class="header-left">
                <a href="catalog.html" class="catalog-link"
                    style="text-decoration: none; color: inherit; display: inline-flex; align-items: center;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right: 8px; vertical-align: middle;">
                        <rect x="3" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="3" width="7" height="7" rx="1" />
                        <rect x="3" y="14" width="7" height="7" rx="1" />
                        <rect x="14" y="14" width="7" height="7" rx="1" />
                    </svg>
                    <span style="vertical-align: middle;">Каталог</span>
                </a>
            </div>
            <div class="header-center">
                <a href="#"
                    style="border: none; background-color: transparent; display: inline-block; text-decoration: none;">
                    <img src="C:\Users\pusto\OneDrive\Рабочий стол\практика\logo.png" alt="Название сайта"
                        style="height: 80px; width: auto; display: block;">
                </a>
            </div>

            <div class="header-right">
                <a href="#" class="icon-link" aria-label="Избранное">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                    </svg>
                </a>

                <a href="#" class="icon-link" aria-label="Корзина">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1" />
                        <circle cx="20" cy="21" r="1" />
                        <path d="M1 1h4l2.7 12.4a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L23 6H6" />
                    </svg>
                </a>
                <a href="#" class="icon-link" aria-label="Личный кабинет">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </a>

            </div>


        </header>

        <div class="register-page">
            <h1 class="register-title">Регистрация</h1>

            <div class="login-prompt">
                Уже есть авторизованный аккаунт?
                <a href="login.html" class="login-link">Войти</a>
            </div>

            <div class="register-container">
                <form class="register-form" id="registerForm" novalidate>
                    <div class="form-column">
                        <div class="form-group">
                            <label class="form-label">Email<span style="color: #ff0000;">*</span></label>
                            <input type="email" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Имя<span style="color: #ff0000;">*</span></label>
                            <input type="text" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Пароль<span style="color: #ff0000;">*</span></label>
                            <input type="password" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Страна</label>
                            <select class="country-select">
                                <option value="">Выберите страну</option>
                                <option value="ru">Россия</option>
                                <option value="by">Беларусь</option>
                                <option value="kz">Казахстан</option>
                                <option value="ua">Украина</option>
                                <option value="other">Другая</option>
                            </select>
                        </div>
                    </div>


                    <div class="form-column">
                        <div class="form-group">
                            <label class="form-label">Телефон</label>
                            <input type="tel" class="form-input">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Фамилия</label>
                            <input type="text" class="form-input">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Подтверждение пароля<span style="color: #ff0000;">*</span></label>
                            <input type="password" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Дата рождения</label>
                            <div class="birthdate-wrapper">
                                <div class="birthdate-inputs">
                                    <input type="text" class="birthdate-input" placeholder="ДД" maxlength="2">
                                    <input type="text" class="birthdate-input" placeholder="ММ" maxlength="2">
                                    <input type="text" class="birthdate-input" placeholder="ГГГГ" maxlength="4">
                                </div>
                                <button type="button" class="calendar-btn">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                        <line x1="16" y1="2" x2="16" y2="6" />
                                        <line x1="8" y1="2" x2="8" y2="6" />
                                        <line x1="3" y1="10" x2="21" y2="10" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>

                <div class="agreement-container">
                    <label class="checkbox-label">
                        <input type="checkbox" class="checkbox-input" id="agreementCheckbox">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">
                            Нажимая «Создать аккаунт», я подтверждаю, что ознакомился с положениями,
                            указанными в статьях <a href="#" class="agreement-link">Условия использования</a>
                            и <a href="#" class="agreement-link">Политика конфиденциальности</a>.
                        </span>
                    </label>
                </div>

                <button type="submit" form="registerForm" class="register-submit-btn">
                    Создать аккаунт
                </button>
            </div>
        </div>
        <div class="footer-red-line">
            <img src="Group 1045948.png" alt="KEITH" class="footer-logo-img">
        </div>

        <div class="footer-info">
            <div class="footer-info-columns">
                <div class="footer-column">
                    <div class="footer-copyright">Каталог</div>
                    <div class="footer-policy">Коллекция 1982</div>
                    <div class="footer-policy">Коллекция 1986</div>
                    <div class="footer-policy">Коллекция 1987</div>
                    <div class="footer-policy">Коллекция 1988</div>
                    <div class="footer-policy">Коллекция 1989</div>
                    <div class="footer-policy2">Политика конфиденциальности</div>
                </div>

                <div class="footer-column">
                    <div class="footer-contacts">Покупателю</div>
                    <div class="footer-phone">Как сделать заказ</div>
                    <div class="footer-phone">Правило возврата</div>
                    <div class="footer-phone">Контакты</div>
                    <div class="footer-sell">Cookies</div>
                </div>
            </div>
        </div>

        <div class="footer-social">
            <div class="social-title">На связи</div>
            <div class="social-icons">
                <a href="#" class="social-icon">
                    <img src="tg.png" alt="Telegram" class="social-img">
                </a>
                <a href="#" class="social-icon">
                    <img src="phone.png" alt="WhatsApp" class="social-img">
                </a>
                <a href="#" class="social-icon">
                    <img src="vk.png" alt="VK" class="social-img">
                </a>
            </div>
        </div>
    </div>
    </footer>
    </div>


    <script src="register.js"></script>
    <script src="index.js"></script>
</body>

</html>
